<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">Iniciar Sesión</h3>
            <div id="error-alert" class="alert alert-danger" style="display: none;"></div>
            <div id="success-alert" class="alert alert-success" style="display: none;"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required autofocus />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required />
              </div>
              <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                Entrar
              </button>
            </form>
            <div class="mt-2 text-center">
              <a href="/forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="mt-2 text-center">
              <a href="/register">¿No tienes cuenta? Regístrate aquí</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorAlert = document.getElementById('error-alert');
      const successAlert = document.getElementById('success-alert');
      
      // Limpiar alerts
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
      
      // Deshabilitar botón
      loginBtn.disabled = true;
      loginBtn.textContent = 'Iniciando...';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          successAlert.textContent = 'Login exitoso! Redirigiendo...';
          successAlert.style.display = 'block';
          
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          errorAlert.textContent = data.message || 'Error en el login';
          errorAlert.style.display = 'block';
        }
        
      } catch (error) {
        console.error('Error:', error);
        errorAlert.textContent = 'Error de conexión';
        errorAlert.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
