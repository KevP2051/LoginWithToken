<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h3 class="card-title mb-4 text-center">Crear Cuenta</h3>
                            <div id="error-alert" class="alert alert-danger" style="display: none;"></div>
                            <div id="success-alert" class="alert alert-success" style="display: none;"></div>
                            <form id="registerForm" novalidate>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required />
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email" name="email" required />
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required />
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required />
                                </div>
                                <button type="submit" class="btn btn-success w-100" id="registerBtn">Crear Cuenta</button>
                            </form>
                            <div class="mt-3 text-center">
                                <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const errorAlert = document.getElementById('error-alert');
                const successAlert = document.getElementById('success-alert');
                const registerBtn = document.getElementById('registerBtn');
                errorAlert.style.display = 'none';
                successAlert.style.display = 'none';
                registerBtn.disabled = true;
                registerBtn.textContent = 'Creando...';
                try {
                    if (!username || !email || !password || !confirmPassword) {
                        errorAlert.textContent = 'Todos los campos son obligatorios';
                        errorAlert.style.display = 'block';
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Crear Cuenta';
                        return;
                    }
                    if (password !== confirmPassword) {
                        errorAlert.textContent = 'Las contraseñas no coinciden';
                        errorAlert.style.display = 'block';
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Crear Cuenta';
                        return;
                    }
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password, confirmPassword })
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        successAlert.textContent = '¡Cuenta creada exitosamente! Ahora puedes iniciar sesión.';
                        successAlert.style.display = 'block';
                        setTimeout(() => { window.location.href = '/login'; }, 1500);
                    } else {
                        errorAlert.textContent = data.message || 'Error al crear la cuenta';
                        errorAlert.style.display = 'block';
                    }
                } catch (error) {
                    errorAlert.textContent = 'Error de conexión';
                    errorAlert.style.display = 'block';
                } finally {
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Crear Cuenta';
                }
            });
        </script>
</body>
</html>
